[project]
name = "spectator-data-collector"
version = "0.0.1"
authors = [
    {name="Shun Huang", email="shun@formosa1544.com"},
    {name="Cipherman", email="cipherman@gmail.com"},
    {name="RicardoRisotto", email="temp@email.com"}
]
description = "IoT Spectator data collector — captures images and video on motion detection from a connected webcam."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.13"

dependencies = [
    "spectator-db",
    "iothealth",
    "fastapi",
    "uvicorn",
    "opencv-python",
    "numpy",
    "mcp",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[project.urls]
repository = "https://github.com/iot-spectator/spectator-data-collector"

[project.scripts]
data-collector = "collector.bin.run:main"
