[project]
name = "spectator-data-collector"
version = "0.0.1"
authors = [
    {name="Shun Huang", email="shun@formosa1544.com"},
    {name="Cipherman", email="cipherman@gmail.com"},
    {name="RicardoRisotto", email="temp@email.com"}
]
description = "IoT Spectator data collector — captures images and video on motion detection from a connected webcam."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11"

dependencies = [
    "spectator-db",
    "iothealth",
    "fastapi",
    "uvicorn",
    # Imported directly by collector.collector for the MCP app type; not
    # relied on as a transitive dependency of fastapi.
    "starlette",
    "opencv-python",
    "numpy",
    # Upper bound is deliberate: 2.0 renamed mcp.server.fastmcp ->
    # mcp.server.mcpserver and changed call_tool's return type, so a major
    # bump is a breaking change for collector/mcp.py. Raise it only after
    # porting.
    "mcp>=2,<3",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[project.urls]
repository = "https://github.com/iot-spectator/spectator-data-collector"

[project.scripts]
data-collector = "collector.bin.run:main"
